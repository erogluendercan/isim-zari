<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuna mı Efe mi?</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 0;
            background-color: #e0f7fa; 
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='10' y='40' font-size='25' opacity='0.3'%3E🧷%3C/text%3E%3Ctext x='50' y='70' font-size='25' opacity='0.3'%3E🍼%3C/text%3E%3C/svg%3E");
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .icerik { flex: 1; padding: 20px; padding-bottom: 120px; }
        .bebek-resmi { font-size: 90px; margin-top: 10px; filter: drop-shadow(0px 4px 5px rgba(0,0,0,0.2)); }
        
        .zar { 
            font-size: 100px; margin: 20px; cursor: pointer; user-select: none; display: inline-block;
            background: white; border-radius: 20px; width: 120px; height: 120px; line-height: 120px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: transform 0.1s;
        }
        
        @keyframes salla {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(25deg) scale(1.1); }
            50% { transform: rotate(-25deg) scale(1.1); }
            75% { transform: rotate(25deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .sallaniyor { animation: salla 0.4s infinite; }

        @keyframes bomba {
            0% { transform: scale(0.1); opacity: 0; }
            50% { transform: scale(1.5) rotate(5deg); opacity: 1; text-shadow: 0 0 40px #ffea00; }
            75% { transform: scale(0.9) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .isim-bomba {
            animation: bomba 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            font-size: 65px; font-weight: 900; margin: 10px 0; display: none; text-transform: uppercase;
        }
        
        .tuna-renk { color: #007aff; text-shadow: 2px 2px 0px white, 4px 4px 0px #004499; }
        .efe-renk { color: #34c759; text-shadow: 2px 2px 0px white, 4px 4px 0px #1c7a33; }

        #mesaj { font-size: 20px; font-weight: bold; background: rgba(255, 255, 255, 0.8); padding: 10px 20px; border-radius: 10px; display: inline-block; }

        .alt-panel { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; padding: 15px 0; 
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1); border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 10;
        }
        .alt-panel h3 { margin: 0 0 5px 0; font-size: 16px; color: #333; }
        .alt-panel p { margin: 0; font-size: 18px; color: #555; }
        .lider-vurgu { font-weight: 900; color: #ff2d55; font-size: 20px; }

        .tekrar-buton {
            display: none; background: #ff9500; color: white; border: none; padding: 15px 30px;
            font-size: 18px; font-weight: bold; border-radius: 30px; margin-top: 20px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="icerik">
        <div class="bebek-resmi">👦🏻🍼🤪</div>
        <p id="mesaj">İlk zarı atmak için zemin üzerindeki zana dokun!</p>
        
        <div>
            <div id="zarGorsel" class="zar">🎲</div>
        </div>

        <div id="sonucIsim" class="isim-bomba"></div>
        <button id="tekrarButon" class="tekrar-buton" onclick="sifirla()">Yeniden At 🎲</button>
    </div>

    <div class="alt-panel">
        <h3>Şu Ana Kadar Çıkan Sonuçlar</h3>
        <p id="istatistik">Drive'dan veriler yükleniyor... ⏳</p>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby6LGQXNIezz03hQniXtkxGACI6zyqqL5FSDwRClJKNkN1t3iTxc7n1h7sDKlrbylQW/exec'; 

        let atisSayisi = 0;
        let toplamDeger = 0;
        let zarAtiliyor = false;

        const zarGorsel = document.getElementById('zarGorsel');
        const mesaj = document.getElementById('mesaj');
        const sonucIsim = document.getElementById('sonucIsim');
        const istatistik = document.getElementById('istatistik');
        const tekrarButon = document.getElementById('tekrarButon');

        const zarlar = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

        function durumlariGetir() {
            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    istatistik.innerHTML = `<span class="lider-vurgu">Önde Giden: ${data.lider}</span><br>Tuna: <strong>${data.tuna}</strong> | Efe: <strong>${data.efe}</strong>`;
                })
                .catch(err => {
                    istatistik.innerHTML = "İnternet bağlantısı bekleniyor...";
                });
        }

        durumlariGetir();

        zarGorsel.addEventListener('click', () => {
            if (atisSayisi >= 2 || zarAtiliyor) return; 

            zarAtiliyor = true;
            zarGorsel.classList.add('sallaniyor'); 
            mesaj.textContent = "Zar yuvarlanıyor... 🎲";

            setTimeout(() => {
                zarGorsel.classList.remove('sallaniyor'); 
                
                const zarDegeri = Math.floor(Math.random() * 6) + 1;
                zarGorsel.textContent = zarlar[zarDegeri - 1]; 
                
                toplamDeger += zarDegeri;
                atisSayisi++;
                zarAtiliyor = false;

                if (atisSayisi === 1) {
                    mesaj.textContent = `İlk zar: ${zarDegeri}. İkinci zar için tekrar tıkla!`;
                } else if (atisSayisi === 2) {
                    const secilenIsim = (toplamDeger % 2 !== 0) ? "Tuna" : "Efe";
                    mesaj.textContent = `Toplam: ${toplamDeger}. Sonuç kaydedildi!`;
                    
                    sonucIsim.textContent = secilenIsim;
                    sonucIsim.className = "isim-bomba"; 
                    
                    if(secilenIsim === "Tuna") {
                        sonucIsim.classList.add("tuna-renk");
                    } else {
                        sonucIsim.classList.add("efe-renk");
                    }
                    
                    sonucIsim.style.display = "block"; 
                    tekrarButon.style.display = "inline-block"; 
                    
                    istatistik.innerHTML = "Drive'a yazılıyor... ⏳";
                    
                    // GÜNCELLENMİŞ GÜÇLÜ FETCH (Gönderme) KODU
                    fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8',
                        },
                        body: JSON.stringify({ isim: secilenIsim })
                    }).then(response => {
                        // İşlem bitince kısa bir süre bekleyip alttaki rakamları yenile
                        setTimeout(durumlariGetir, 1500); 
                    }).catch(error => {
                        // Tarayıcı güvenlik uyarısı verse bile veri çoktan gitmiş olur, tabloyu yine de yenile
                        setTimeout(durumlariGetir, 1500);
                    });
                }
            }, 600); 
        });

        function sifirla() {
            atisSayisi = 0;
            toplamDeger = 0;
            zarGorsel.textContent = '🎲';
            sonucIsim.style.display = 'none';
            tekrarButon.style.display = 'none';
            mesaj.textContent = "İlk zarı atmak için zemin üzerindeki zana dokun!";
        }
    </script>
</body>
</html>
